<main class="min-h-full w-100 flex-center register-page">
  <div class="w-100 px-3 py-5" style="max-width: 1080px;">
    <div class="text-center mb-4">
      <img src="/assets/images/logo-placeholder.svg" class="brand-logo" alt="logo">
      <h3 class="text-primary mb-0">Cashew Production Management System</h3>
      <p class="text-muted">Create your account</p>
    </div>

    <div class="row g-0 auth-card overflow-hidden">
      <div class="col-lg-5 bg-primary d-none d-lg-block">
        <app-image-slider></app-image-slider>
      </div>

      <div class="col-lg-7 bg-white p-4 p-lg-5">
        <h2 class="fw-bold text-primary">Registration</h2>
        <p class="text-muted mb-4">Enter your information below to create a system account.</p>

        <app-form *ngIf="fp" [fp]="fp"></app-form>

        <div class="text-end mt-3">
          Already have an account?
          <a routerLink="/auth/login">Sign in</a>
        </div>
      </div>
    </div>
  </div>
</main>
