<main class="min-h-full text-dark w-100 flex-center auth-page">
  <div class="w-100 max-w-920 px-3 py-0">

    <div class="mb-3 text-center d-flex flex-column align-items-center">
      <img
        src="/assets/images/logo.png"
        class="brand-logo"
        alt="logo"
      />

      <div class="faded">
        <h2 class="m-0 text-primary">TANZANIA AGRICULTURAL RESEARCH INSTITE(TARI)</h2>
        <h4 class="m-0 text-primary">TARI VEHICLE'S MANAGEMENT SYSTEM(TVMS)</h4>
      </div>
    </div>

    <div class="row g-0 mt-4 auth-card overflow-hidden">
      <div class="col-md-6 bg-primary d-none d-md-block">
        <app-image-slider
          [useBgImage]="true"
          slideClass="h-100"
          sliderClass="h-100"
          innerClass="h-100"
          [showNavigations]="false">
        </app-image-slider>
         <!-- <img
        src="/assets/images/image 1.png"
        class="brand-logo"
        alt="logo"
      /> -->
      </div>

<div class="col-md-6 auth-form-section p-4 p-lg-5">     
     <h1 class="mb-1 fw-bold text-primary">TVMS</h1>
        <!-- <h6 class="mb-4">Sign in to your account</h6> -->
        <h6 class="mb-4">
  {{ 'LOGIN.TITLE' | translate }}
</h6>

        <mat-card class="p-0 no-bg no-shadow">
          <app-form *ngIf="fp" [fp]="fp"></app-form>

          <div class="text-end mt-3" *ngIf="showRegister">
            <!-- <p class="mb-2">
              Don't have an account?
              <a routerLink="/auth/register">Register</a>
            </p> -->
            <p>
  <!-- {{ 'LOGIN.NO_ACCOUNT' | translate }} -->

  <!-- <a routerLink="/auth/register">
    {{ 'LOGIN.REGISTER' | translate }}
  </a> -->

    <a routerLink="/drivers">
driver  </a>
 <a routerLink="/supervisor">
supervisor  </a>
 <a routerLink="/centerdirector">
CD  </a>
<a routerLink="/TO">
TO  </a>
<a routerLink="/AM">
AM  </a>
<a routerLink="/DHRAM">
DHRAM  </a>
</p>
          </div>

          <div class="pt-2 d-flex justify-content-between align-items-center">
            <action-buttons
              class="d-flex"
              [actionButtons]="utilityButtons"
              [value]="options">
            </action-buttons>

            <!-- <a routerLink="/auth/forgot-password">Forgot password?</a> -->
            <a routerLink="/auth/forgot-password">
  {{ 'LOGIN.FORGOT_PASSWORD' | translate }}
</a>
          </div>
        </mat-card>
      </div>
    </div>
  </div>
</main>
