
<div class="auth-page">

  <div class="auth-card login-card">

    <div class="brand-header">
      <img
        src="assets/images/logo.png"
        alt="TARI Logo"
      />

      <div>
        <h2>
          {{ 'AUTH.ORGANIZATION' | translate }}
        </h2>

        <p>
          {{ 'AUTH.SYSTEM_NAME' | translate }}
        </p>
      </div>
    </div>

    <div class="form-heading">
      <h1>
        {{ 'AUTH.WELCOME_BACK' | translate }}
      </h1>

      <p>
        {{ 'AUTH.LOGIN_DESCRIPTION' | translate }}
      </p>
    </div>

    <div
      *ngIf="errorMessage"
      class="error-alert"
      role="alert"
    >
      {{ errorMessage | translate }}
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      novalidate
    >

      <div class="form-group">
        <label for="loginEmail">
          {{ 'AUTH.EMAIL' | translate }}
        </label>

        <input
          id="loginEmail"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="name@tari.go.tz"
        />

        <small
          *ngIf="f.email.touched && f.email.invalid"
          class="field-error"
        >
          {{ 'AUTH.INVALID_EMAIL' | translate }}
        </small>
      </div>

      <div class="form-group">
        <label for="loginPassword">
          {{ 'AUTH.PASSWORD' | translate }}
        </label>

        <div class="password-box">
          <input
            id="loginPassword"
            formControlName="password"
            [type]="showPassword ? 'text' : 'password'"
            autocomplete="current-password"
          />

          <button
            type="button"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            <span class="material-symbols-outlined">
              {{ showPassword ? 'visibility_off' : 'visibility' }}
            </span>
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="submit-btn"
        [disabled]="loading"
      >
        <span class="material-symbols-outlined">
          login
        </span>

        {{
          (loading ? 'AUTH.SIGNING_IN' : 'AUTH.SIGN_IN')
            | translate
        }}
      </button>

    </form>

    <div class="auth-footer">
      {{ 'AUTH.NO_ACCOUNT' | translate }}

      <a routerLink="/register">
        {{ 'AUTH.REGISTER' | translate }}
      </a>
    </div>

  </div>

</div>
