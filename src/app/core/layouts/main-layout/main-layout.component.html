<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <img src="/assets/images/logo-placeholder.svg" alt="Logo">
      <div>
        <strong>CPMS</strong>
        <small>Cashew Production</small>
      </div>
    </div>

    <nav>
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.route"
        routerLinkActive="active">
        <mat-icon>{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    </nav>
  </aside>

  <div class="content-shell">
    <header class="topbar">
      <div>
        <strong>Cashew Production Management System</strong>
      </div>
      <button mat-button (click)="auth.logout()">
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    </header>

    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
