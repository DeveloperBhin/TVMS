<app-header></app-header>

<div class="farm-layout">

  <app-sidebar></app-sidebar>

  <main class="farm-content">

    <div class="container-fluid px-3 px-md-4 py-4">

      <div class="add-farm-card">

        <!-- TITLE -->
        <div class="form-title">
          <h2>
            {{ 'ADD_FARM.TITLE' | translate }}
          </h2>
        </div>


        <form
          [formGroup]="farmForm"
          (ngSubmit)="submitFarm()"
        >

         <div class="form-success">
          <h3>
            {{ 'ADD_FARM.SUCCESS_TITLE' | translate }}
          </h3>
        </div>
          <div class="form-success">
          <h3>
            {{ 'ADD_FARM.FARM_ID' | translate }}
          </h3>
        </div>


          <!-- BUTTON -->
          <div class="form-actions">

            <button
              type="submit"
              class="submit-btn"
              routerLink="/farms">
              {{ 'ADD_FARM.BACK_TO_FARMS' | translate }}
            </button>

          </div>

           

        </form>

      </div>

    </div>

  </main>

</div>
